name: VidSnap 回归检查

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 FFmpeg
        run: choco install ffmpeg --yes --no-progress
      - name: 验证媒体工具
        run: |
          ffmpeg -version
          ffprobe -version
      - name: 安装锁定依赖
        run: npm ci
      - name: 代码规范
        run: npm run lint
      - name: 类型检查
        run: npx tsc --noEmit
      - name: 自动回归
        run: npm run test:security
      - name: 生产构建
        run: npm run build
