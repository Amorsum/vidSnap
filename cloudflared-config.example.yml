# Cloudflare 永久隧道配置模板
# 使用方式：复制为 cloudflared-config.yml 并填入真实值（该文件已在 .gitignore 中，不会提交）
#
# 步骤：
#   1. 运行 `cloudflared tunnel create <隧道名>` 获取 tunnel ID 和 credentials 文件
#   2. 运行 `cloudflared tunnel route dns <隧道名> <你的域名>` 绑定域名
#   3. 将下方 <TUNNEL_ID> 和路径替换为真实值
#   4. 运行 `cloudflared tunnel --config cloudflared-config.yml run`
tunnel: <TUNNEL_ID>
credentials-file: C:/Users/<你的用户名>/.cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: vidsnap.amorsum.top
    service: http://localhost:3000
  # 其他域名一律 404（避免误路由）
  - service: http_status:404
